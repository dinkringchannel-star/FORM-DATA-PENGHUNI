<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data - Google Sheets & Drive</title>

    <!-- Isi dengan URL Web App Google Apps Script setelah Deploy -->
    <script>const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4-KDfJt6CGg-RplSzHHlGrtcuE9-wlvz5kUjqPjk3qKNtMxf58LDbDJcs4UhhRQxT/exec';</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            padding: 10px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }


        .form-group {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 18px;
        }


        label {
            width: 220px;
            font-weight: bold;
            color: #444;
            flex-shrink: 0;
            text-align: left;
            font-size: 12px;
        }

        input,
        textarea,
        select {
            flex: 1;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 12px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .preview {
            margin-top: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .preview h2 {
            margin-top: 0;
            color: #222;
        }

        .preview p {
            margin: 10px 0;
            line-height: 1.5;
        }

        input:disabled {
            background: #e5e7eb;
            cursor: not-allowed;
        }

        .subjudul {
            font-size: 16px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .tanggal-dibuat {
            text-align: right;
            margin-top: 25px;
            font-size: 12px;
            color: #555;
        }

        @media(max-width: 600px) {
            .container {
                padding: 18px;
            }

            h1 {
                font-size: 22px;
            }

            .form-group {
                flex-direction: row;
                align-items: center;
            }

            label {
                width: 130px;
                font-size: 10px;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }

        table th,
        table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        table th {
            background: #2563eb;
            color: white;
        }

        table input {
            border: none;
            width: 100%;
            padding: 4px;
        }

        .table-group {
            flex-direction: column;
            align-items: stretch;
        }

        .table-group label {
            width: 100%;
            margin-bottom: 2px;
        }

        .table-wrapper {
            width: 100%;
        }
            .btn:disabled { opacity: .65; cursor: wait; }
        .info-drive { margin-top: 15px; padding: 12px; background: #eef6ff; border-radius: 10px; font-size: 12px; }
    </style>
</head>

<body>

    <div class="container">
        <h1>Form Data PDF</h1>
        <h3 class="subjudul">A. Rumah di Cendana</h3>
        <div class="form-group">
            <label>Alamat Blok</label>
            <input type="text" id="alamatblok" placeholder="Masukkan alamat">
        </div>

        <div class="form-group">
            <label>Menetap Sejak</label>
            <input type="text" id="menetapsejak" placeholder="Masukkan bulan dan tahun menetap">
        </div>

        <div class="form-group">
            <label>Status Kepemilikan</label>
            <select id="Status" onchange="cekStatusKepemilikan()">
                <option value="Milik Sendiri">Milik Sendiri</option>
                <option value="Kontrak">Kontrak</option>
                <option value="Keluarga">Keluarga</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nama Pemilik Rumah</label>
            <input type="text" id="namapemilik" placeholder="Masukkan nama pemilik rumah">
        </div>

        <div class="form-group">
            <label>Nomor HP Pemilik</label>
            <input id="nomorhppemilik" placeholder="Masukkan nomor HP"></input>
        </div>

        <h3 class="subjudul">B. DATA KEPALA KELUARGA</h3>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaLengkap" placeholder="Masukkan nama lengkap">
        </div>

        <div class="form-group">
            <label>Tempat, Tgl. Lahir</label>
            <input type="text" id="ttl" placeholder="Contoh: Bandung, 12 Januari 1990">
        </div>

        <div class="form-group">
            <label>Nomor HP Kepala Keluarga</label>
            <input type="text" id="nomorHpKk" placeholder="Masukkan 08xxxxxxxxxx">
        </div>

        <div class="form-group">
            <label>Agama</label>
            <select id="agama">
                <option value="">Pilih Agama</option>
                <option>Islam</option>
                <option>Kristen</option>
                <option>Katolik</option>
                <option>Hindu</option>
                <option>Buddha</option>
                <option>Konghucu</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jenis Kelamin</label>
            <select id="jenisKelamin">
                <option value="">Pilih Jenis Kelamin</option>
                <option>Laki-laki</option>
                <option>Perempuan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Status Perkawinan</label>
            <select id="statusPerkawinan">
                <option value="">Pilih Status</option>
                <option>Belum Menikah</option>
                <option>Menikah</option>
                <option>Cerai Hidup</option>
                <option>Cerai Mati</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kewarganegaraan</label>
            <input type="text" id="kewarganegaraan" placeholder="Contoh: Indonesia">
        </div>

        <div class="form-group">
            <label>Alamat Sesuai KTP</label>
            <textarea id="alamatKtp" placeholder="Masukkan alamat sesuai KTP"></textarea>
        </div>

        <div class="form-group table-group">
            <h3 class="subjudul">C. DAFTAR PENGHUNI SERUMAH</h3>

            <div class="table-wrapper">

                <table id="familyTable">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Hubungan</th>
                            <th>Tanggal Lahir</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text" placeholder="Nama"></td>
                            <td><input type="text" placeholder="Hubungan"></td>
                            <td><input type="date"></td>
                        </tr>
                    </tbody>
                </table>

                <br>

                <button type="button" class="btn" onclick="tambahBaris()">
                    + Tambah Data
                </button>

            </div>
        </div>


        <div class="form-group table-group">
            <h3 class="subjudul">D. KONTAK DARURAT</h3>

            <div class="table-wrapper">

                <table id="emergencyTable">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Nomor WA</th>
                            <th>Hubungan</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td><input type="text" placeholder="Nama"></td>
                            <td><input type="text" placeholder="08xxxxxxxxxx"></td>
                            <td><input type="text" placeholder="Hubungan"></td>
                        </tr>
                    </tbody>
                </table>

                <br>

                <button type="button" class="btn" onclick="tambahKontakDarurat()">
                    + Tambah Kontak Darurat
                </button>

            </div>
        </div>

        <button class="btn" id="btnSimpan" onclick="simpanData()">
            💾 Simpan Data
        </button>
        <br><br>
        <button class="btn" type="button" onclick="downloadPDFLokal()">
            📤 Kirim PDF ke WhatsApp
        </button>
        <br><br>

        <div class="tanggal-dibuat">
            Dibuat tanggal: <span id="tanggalHariIni"></span>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('input, textarea, select');

        inputs.forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        function updatePreview() {
            // Preview bersifat opsional. Tidak menjalankan apa pun jika elemen preview tidak ada.
            const preview = document.getElementById('preview');
            if (!preview) return;
        }

        function kirimWhatsApp() {
            const alamatblok = document.getElementById('alamatblok').value;
            const menetapsejak = document.getElementById('menetapsejak').value;
            const namapemilik = document.getElementById('namapemilik').value;
            const Status = document.getElementById('Status').value;
            const nomorhppemilik = document.getElementById('nomorhppemilik').value;

            const nomorTujuan = '6289670106887';

            const pesan = `Halo, berikut data formulir:%0A%0A`
                + `Nama: ${nama}%0A`
                + `Email: ${email}%0A`
                + `WhatsApp: ${wa}%0A`
                + `Jenis Kelamin: ${status}%0A`
                + `Alamat: ${alamat}`;

            window.open(`https://wa.me/${nomorTujuan}?text=${pesan}`, '_blank');
        }



        function ambilDataForm() {
            const get = id => document.getElementById(id)?.value || '';

            const penghuni = [...document.querySelectorAll('#familyTable tbody tr')].map(row => {
                const c = row.querySelectorAll('input');
                return {
                    nama: c[0]?.value || '',
                    hubungan: c[1]?.value || '',
                    tanggalLahir: c[2]?.value || ''
                };
            }).filter(r => r.nama || r.hubungan || r.tanggalLahir);

            const kontakDarurat = [...document.querySelectorAll('#emergencyTable tbody tr')].map(row => {
                const c = row.querySelectorAll('input');
                return {
                    nama: c[0]?.value || '',
                    nomorWa: c[1]?.value || '',
                    hubungan: c[2]?.value || ''
                };
            }).filter(r => r.nama || r.nomorWa || r.hubungan);

            return {
                alamatblok: get('alamatblok'),
                menetapsejak: get('menetapsejak'),
                statusKepemilikan: get('Status'),
                namapemilik: get('namapemilik'),
                nomorhppemilik: get('nomorhppemilik'),
                namaLengkap: get('namaLengkap'),
                ttl: get('ttl'),
                nomorHpKk: get('nomorHpKk'),
                agama: get('agama'),
                jenisKelamin: get('jenisKelamin'),
                statusPerkawinan: get('statusPerkawinan'),
                kewarganegaraan: get('kewarganegaraan'),
                alamatKtp: get('alamatKtp'),
                penghuni,
                kontakDarurat
            };
        }

        async function buatPDFBlob() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const biru = [37, 99, 235];
            const data = ambilDataForm();

            doc.setFontSize(18);
            doc.setTextColor(...biru);
            doc.text('DATA FORMULIR', 105, 20, { align: 'center' });
            doc.setTextColor(0, 0, 0);

            const xLabel = 20, xTitik = 70, xValue = 75;

            doc.setFontSize(14); doc.setTextColor(...biru);
            doc.text('A. RUMAH DI CENDANA', 20, 32);
            doc.setTextColor(0,0,0); doc.setFontSize(12);

            const aRows = [
                ['Alamat Blok', data.alamatblok],
                ['Menetap Sejak', data.menetapsejak],
                ['Status Kepemilikan', data.statusKepemilikan],
                ['Nama Pemilik Rumah', data.namapemilik],
                ['Nomor HP Pemilik', data.nomorhppemilik]
            ];
            let y = 42;
            aRows.forEach(([label,val]) => {
                doc.text(label, xLabel, y); doc.text(':', xTitik, y);
                doc.text(val || '-', xValue, y); y += 8;
            });

            doc.setFontSize(14); doc.setTextColor(...biru);
            doc.text('B. DATA KEPALA KELUARGA', 20, 95);
            doc.setTextColor(0,0,0); doc.setFontSize(12);
            y = 103;
            [
                ['Nama Lengkap', data.namaLengkap],
                ['Tempat, Tgl. Lahir', data.ttl],
                ['Nomor HP', data.nomorHpKk],
                ['Agama', data.agama],
                ['Jenis Kelamin', data.jenisKelamin],
                ['Status Perkawinan', data.statusPerkawinan],
                ['Kewarganegaraan', data.kewarganegaraan]
            ].forEach(([label,val]) => {
                doc.text(label, xLabel, y); doc.text(':', xTitik, y);
                doc.text(val || '-', xValue, y); y += 8;
            });

            doc.text('Alamat Sesuai KTP', xLabel, y); doc.text(':', xTitik, y);
            const splitAlamat = doc.splitTextToSize(data.alamatKtp || '-', 110);
            doc.text(splitAlamat, xValue, y);
            y += splitAlamat.length * 5 + 10;

            const addTable = (title, headers, rows, widths) => {
                if (y > 255) { doc.addPage(); y = 20; }
                doc.setFontSize(14); doc.setTextColor(...biru); doc.text(title, 20, y);
                doc.setTextColor(0,0,0); y += 8;
                let x = 20;
                doc.setFontSize(10);
                headers.forEach((h,i) => {
                    doc.rect(x, y-5, widths[i], 8);
                    doc.text(h, x+3, y);
                    x += widths[i];
                });
                y += 8;
                rows.forEach(row => {
                    if (y > 275) { doc.addPage(); y = 20; }
                    let x = 20;
                    row.forEach((v,i) => {
                        doc.rect(x, y-5, widths[i], 8);
                        const txt = doc.splitTextToSize(String(v || '-'), widths[i]-6)[0];
                        doc.text(txt, x+3, y);
                        x += widths[i];
                    });
                    y += 8;
                });
                y += 10;
            };

            addTable('C. DAFTAR PENGHUNI SERUMAH',
                ['Nama','Hubungan','Tanggal Lahir'],
                data.penghuni.map(r => [r.nama,r.hubungan,r.tanggalLahir]),
                [60,60,50]);

            addTable('D. KONTAK DARURAT',
                ['Nama','Nomor WA','Hubungan'],
                data.kontakDarurat.map(r => [r.nama,r.nomorWa,r.hubungan]),
                [60,60,50]);

            const tanggalFormat = new Date().toLocaleDateString('id-ID', {
                day:'2-digit', month:'long', year:'numeric'
            });
            doc.setFontSize(10);
            if (y > 280) { doc.addPage(); y = 20; }
            doc.text(`Dibuat tanggal: ${tanggalFormat}`, 190, y + 5, {align:'right'});

            return doc.output('blob');
        }

        async function blobToBase64(blob) {
            return await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function simpanData() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('GANTI_DENGAN')) {
                alert('URL Web App Google Apps Script belum diisi.');
                return;
            }

            const btn = document.getElementById('btnSimpan');
            const oldText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Menyimpan...';

            try {
                const data = ambilDataForm();
                const pdfBlob = await buatPDFBlob();
                const pdfBase64 = await blobToBase64(pdfBlob);

                const payload = {
                    action: 'simpan',
                    data,
                    pdfBase64,
                    fileName: `Data_${(data.namaLengkap || 'Form').replace(/[^a-zA-Z0-9_-]/g,'_')}_${Date.now()}.pdf`
                };

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain;charset=utf-8'},
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (!result.success) throw new Error(result.message || 'Gagal menyimpan data.');

                alert(
                    'Berhasil disimpan!' 
                );

            } catch (err) {
                console.error(err);
                alert('Gagal menyimpan data: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = oldText;
            }
        }

        async function downloadPDFLokal() {
            const btn = event?.currentTarget || document.querySelector('button[onclick="downloadPDFLokal()"]');
            const oldText = btn ? btn.innerHTML : '';
            let blobUrl = null;

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '⏳ Membuat PDF...';
                }

                // 1. Buat PDF langsung di browser.
                const blob = await buatPDFBlob();
                const data = ambilDataForm();
                const fileName = `Data_${(data.namaLengkap || 'Form').replace(/[^a-zA-Z0-9_-]/g,'_')}_${Date.now()}.pdf`;
                const pdfFile = new File([blob], fileName, { type: 'application/pdf' });

                /*
                 * 2. PRIORITAS: Web Share API.
                 *
                 * Jika browser/perangkat mendukung file sharing, PDF akan
                 * masuk ke dialog Share bawaan perangkat. Pada perangkat yang
                 * menyediakan WhatsApp sebagai target share, pengguna dapat
                 * memilih WhatsApp dan PDF dikirim sebagai attachment/file.
                 *
                 * navigator.share() HARUS dipanggil dari aksi klik pengguna.
                 */
                if (navigator.share && navigator.canShare) {
                    const shareData = { files: [pdfFile] };

                    if (navigator.canShare(shareData)) {
                        if (btn) btn.innerHTML = '📤 Membuka WhatsApp...';

                        try {
                            await navigator.share({
                                files: [pdfFile],
                                title: 'Data Formulir PDF',
                                text: `Data formulir ${data.namaLengkap || ''}`.trim()
                            });

                            // Berhasil diserahkan ke share target.
                            return;
                        } catch (shareErr) {
                            // Jika user membatalkan dialog share, jangan lanjut
                            // membuka WhatsApp Web secara otomatis.
                            if (shareErr && shareErr.name === 'AbortError') {
                                return;
                            }

                            console.warn('Web Share API gagal:', shareErr);
                        }
                    }
                }

                /*
                 * 3. FALLBACK DESKTOP: WhatsApp Web.
                 *
                 * WhatsApp Web tidak menyediakan URL resmi yang dapat dipakai
                 * halaman web untuk menyisipkan attachment PDF otomatis.
                 * Karena itu fallback membuka chat WhatsApp Web dengan pesan
                 * dan PDF tetap diunduh agar dapat dilampirkan secara manual.
                 */
                blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();

                const nomorTujuan = '6289670106887';
                const pesan =
                    `Halo, berikut data formulir:%0A%0A` +
                    `Nama Kepala Keluarga: ${encodeURIComponent(data.namaLengkap || '-')}%0A` +
                    `Alamat Blok: ${encodeURIComponent(data.alamatblok || '-')}%0A%0A` +
                    `📎 File PDF sudah diunduh. Silakan lampirkan file PDF ini di chat.`;

                window.open(`https://web.whatsapp.com/send?phone=${nomorTujuan}&text=${pesan}`, '_blank');

                alert(
                    'Browser ini tidak mendukung pengiriman file langsung melalui Web Share API.\n\n' +
                    'PDF sudah diunduh dan WhatsApp Web dibuka. Silakan lampirkan PDF tersebut ke chat.'
                );

            } catch (err) {
                console.error(err);
                alert('Gagal membuat/mengirim PDF: ' + (err.message || err));
            } finally {
                if (blobUrl) {
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
                }
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = oldText || '📄 Download PDF';
                }
            }
        }

        async function generatePDF() {
            // Dipertahankan untuk kompatibilitas tombol lama.
            await downloadPDFLokal();
        }

        function tambahBaris() {
            const tbody = document.querySelector('#familyTable tbody');

            const tr = document.createElement('tr');

            tr.innerHTML = `
        <td><input type="text" placeholder="Nama"></td>
        <td><input type="text" placeholder="Hubungan"></td>
        <td><input type="date"></td>
    `;

            tbody.appendChild(tr);
        }


        function tambahKontakDarurat() {
            const tbody = document.querySelector('#emergencyTable tbody');

            const tr = document.createElement('tr');

            tr.innerHTML = `
        <td><input type="text" placeholder="Nama"></td>
        <td><input type="text" placeholder="08xxxxxxxxxx"></td>
        <td><input type="text" placeholder="Hubungan"></td>
    `;

            tbody.appendChild(tr);
        }

        function cekStatusKepemilikan() {

            const status = document.getElementById('Status').value;

            const namaPemilik = document.getElementById('namapemilik');
            const nomorhppemilik = document.getElementById('nomorhppemilik');

            // Jika Milik Sendiri
            if (status === 'Milik Sendiri') {

                // Nonaktifkan input
                namaPemilik.disabled = true;
                nomorhppemilik.disabled = true;

                // Kosongkan isi
                namaPemilik.value = '';
                nomorhppemilik.value = '';

                // Ubah placeholder
                namaPemilik.placeholder = 'Tidak perlu diisi';
                nomorhppemilik.placeholder = 'Tidak perlu diisi';

            } else {

                // Aktifkan input
                namaPemilik.disabled = false;
                nomorhppemilik.disabled = false;

                // Kembalikan placeholder
                namaPemilik.placeholder = 'Masukkan nama pemilik rumah';
                nomorhppemilik.placeholder = 'Masukkan nomor HP';
            }
        }

        // Jalankan otomatis saat halaman dibuka
        window.onload = cekStatusKepemilikan;

        // Tanggal otomatis hari ini
        const tanggal = new Date();

        const opsiTanggal = {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        };

        document.getElementById('tanggalHariIni').innerHTML =
            tanggal.toLocaleDateString('id-ID', opsiTanggal);
    </script>

</body>

</html>
